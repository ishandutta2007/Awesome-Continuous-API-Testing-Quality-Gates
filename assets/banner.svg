<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Dynamic Pulse Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <style>
      .pulsing-orb {
        animation: pulse 6s ease-in-out infinite alternate;
      }
      .orbit-packet {
        animation: flowPacket 4s linear infinite;
      }
      .badge-glow {
        animation: badgePulse 3s ease-in-out infinite alternate;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: dash 20s linear infinite;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.4; }
        100% { transform: scale(1.15); opacity: 0.8; }
      }
      @keyframes badgePulse {
        0% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.4)); }
        100% { filter: drop-shadow(0 0 10px rgba(129, 140, 248, 0.8)); }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#gridPattern)" />

  <!-- Animated Glowing Orbs in Background -->
  <g class="pulsing-orb" transform-origin="200 150">
    <circle cx="200" cy="150" r="160" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  </g>
  <g class="pulsing-orb" transform-origin="1000 250">
    <circle cx="1000" cy="250" r="180" fill="#818cf8" opacity="0.12" filter="url(#glow)" />
  </g>
  <g class="pulsing-orb" transform-origin="600 350">
    <circle cx="600" cy="350" r="140" fill="#c084fc" opacity="0.1" filter="url(#glow)" />
  </g>

  <!-- Dynamic CI/CD Pipeline Visual Tracks (Subtle Background Flow) -->
  <g opacity="0.45">
    <path class="flow-line" d="M 80,330 C 250,330 350,370 500,370 C 650,370 750,330 900,330 C 1050,330 1100,350 1150,350" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-line" d="M 50,360 C 200,360 380,320 550,320 C 720,320 850,360 1000,360 C 1080,360 1120,330 1160,330" fill="none" stroke="#818cf8" stroke-width="2" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Badge, Title, Subtitle, & Feature Pills -->
  <!-- Top Category Pill Badge -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" class="badge-glow" />
    <circle cx="-115" cy="0" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="5" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CONTINUOUS QUALITY GATES</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(600, 130)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#accentGrad)" letter-spacing="-0.5" filter="url(#lightGlow)">
      Awesome Continuous API Testing
    </text>
    <text y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      &amp; Automated Quality Gates
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 222)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated DevOps tooling, API contract linters, synthetic monitors &amp; shift-left verification pipelines
    </text>
  </g>

  <!-- Interactive Dynamic Pipeline Nodes / Quality Gates Banner Row -->
  <g transform="translate(140, 275)">
    <!-- Stage 1: Commit & Lint -->
    <g transform="translate(0, 0)">
      <rect width="180" height="54" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <circle cx="28" cy="27" r="10" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5" />
      <text x="28" y="31" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">01</text>
      <text x="48" y="23" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Contract Lint</text>
      <text x="48" y="40" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Spectral · OpenAPI</text>
    </g>

    <!-- Connector 1 -->
    <g transform="translate(180, 27)">
      <line x1="0" y1="0" x2="45" y2="0" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" />
      <circle cx="22" cy="0" r="3" fill="#38bdf8">
        <animate attributeName="cx" values="5;40;5" dur="3s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Stage 2: Contract Tests -->
    <g transform="translate(225, 0)">
      <rect width="195" height="54" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <circle cx="28" cy="27" r="10" fill="#6366f1" fill-opacity="0.25" stroke="#818cf8" stroke-width="1.5" />
      <text x="28" y="31" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">02</text>
      <text x="48" y="23" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Consumer Contract</text>
      <text x="48" y="40" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Pact · Dredd</text>
    </g>

    <!-- Connector 2 -->
    <g transform="translate(420, 27)">
      <line x1="0" y1="0" x2="45" y2="0" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 3" />
      <circle cx="22" cy="0" r="3" fill="#818cf8">
        <animate attributeName="cx" values="5;40;5" dur="3.2s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Stage 3: Functional / Security -->
    <g transform="translate(465, 0)">
      <rect width="195" height="54" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <circle cx="28" cy="27" r="10" fill="#9333ea" fill-opacity="0.25" stroke="#c084fc" stroke-width="1.5" />
      <text x="28" y="31" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">03</text>
      <text x="48" y="23" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Automated Tests</text>
      <text x="48" y="40" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Newman · Hurl · ZAP</text>
    </g>

    <!-- Connector 3 -->
    <g transform="translate(660, 27)">
      <line x1="0" y1="0" x2="45" y2="0" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 3" />
      <circle cx="22" cy="0" r="3" fill="#c084fc">
        <animate attributeName="cx" values="5;40;5" dur="2.8s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Stage 4: Gate Passed -->
    <g transform="translate(705, 0)">
      <rect width="215" height="54" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
      <circle cx="28" cy="27" r="10" fill="#059669" fill-opacity="0.3" stroke="#34d399" stroke-width="1.5" />
      <text x="28" y="32" fill="#34d399" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">✓</text>
      <text x="48" y="23" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Deploy Quality Gate</text>
      <text x="48" y="40" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Exit 0 · Zero Regressions</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#accentGrad)" />
</svg>
